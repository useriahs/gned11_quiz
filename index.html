<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GNED 11 Quiz: Kontekstwalisadong Komunikasyon</title>
<style>
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#14213D; --muted:#5A6781; --line:#D5DDEB;
  --sun:#F5B700; --sun-ink:#14213D;
  --ok:#17795A; --ok-bg:#E3F4EC; --bad:#B63A2B; --bad-bg:#FBE9E6;
  --focus:#2F5BEA;
  --display:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:Georgia,"Times New Roman",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1526; --surface:#172038; --ink:#EAF0FF; --muted:#9AA8C7; --line:#2A3658;
    --ok:#4FD1A0; --ok-bg:#12372B; --bad:#FF8A78; --bad-bg:#3E1D19; --focus:#8DA8FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1526; --surface:#172038; --ink:#EAF0FF; --muted:#9AA8C7; --line:#2A3658;
  --ok:#4FD1A0; --ok-bg:#12372B; --bad:#FF8A78; --bad-bg:#3E1D19; --focus:#8DA8FF;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;min-height:100vh}
.wrap{max-width:680px;margin:0 auto;padding:28px 20px 64px}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:99px;margin:26px 0 8px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--sun);border-radius:99px;transition:width .35s ease}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px}
.topic{display:inline-block;font-family:var(--display);font-size:.85rem;font-weight:500;color:var(--muted);margin-bottom:10px}
.prompt{font-family:var(--display);font-weight:500;font-size:clamp(1.2rem,3.8vw,1.5rem);line-height:1.3;margin:0 0 22px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{width:100%;text-align:left;display:flex;gap:14px;align-items:flex-start;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:13px 14px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.key{flex:none;width:28px;height:28px;border-radius:7px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.9rem}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .key{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .key{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tools{margin-top:18px;min-height:24px}
.link{font:inherit;font-size:.95rem;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
.hint{margin:10px 0 0;padding:10px 12px;border-left:4px solid var(--sun);background:var(--bg);font-size:.95rem}
.feedback{margin-top:20px;padding:16px;border-radius:10px;font-size:.98rem}
.feedback.ok{background:var(--ok-bg)} .feedback.bad{background:var(--bad-bg)}
.feedback strong{font-family:var(--display);font-size:1.05rem;display:block;margin-bottom:4px}
.btn{font-family:var(--display);font-weight:700;font-size:1rem;background:var(--sun);color:var(--sun-ink);border:0;border-radius:10px;padding:13px 22px;cursor:pointer;margin-top:18px}
.btn:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink);margin-left:8px}
.score{font-family:var(--display);font-weight:700;font-size:clamp(3rem,14vw,4.6rem);line-height:1;margin:6px 0 4px}
.score small{font-size:.4em;color:var(--muted);font-weight:500}
.verdict{font-family:var(--display);font-size:1.2rem;margin:0 0 20px}
.review{margin:26px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.review li{border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.95rem;background:var(--bg)}
.review b{font-family:var(--display)}
.review .a{color:var(--ok);font-weight:600}
.review .u{color:var(--bad)}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>GNED 11: Kontekstwalisadong Komunikasyon</h1>
    <p>Aralin 1 (Wikang Pambansa) at Aralin 2 (Gawing Pangkomunikasyon ng mga Pilipino)</p>
  </header>

  <div id="quiz">
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
    <div class="meta"><span id="count"></span><span id="tally"></span></div>
    <section class="card" aria-live="polite">
      <span class="topic" id="topic"></span>
      <h2 class="prompt" id="prompt"></h2>
      <ul class="opts" id="opts"></ul>
      <div class="tools"><button class="link" id="hintBtn" type="button">Kailangan ng hint?</button><p class="hint hidden" id="hint"></p></div>
      <div id="feedback"></div>
      <button class="btn hidden" id="next" type="button">Susunod na tanong</button>
    </section>
  </div>

  <div id="result" class="hidden">
    <section class="card">
      <div class="score"><span id="final"></span><small> / 10</small></div>
      <p class="verdict" id="verdict"></p>
      <button class="btn" id="retry" type="button">Ulitin ang quiz</button>
      <button class="btn ghost" id="retryMissed" type="button">Ulitin ang mga mali</button>
      <ul class="review" id="review"></ul>
    </section>
  </div>
</div>

<script>
const QUESTIONS = [
 {t:"Aralin 1",p:"Anong memorandum ng CHED ang nagtanggal sa Filipino bilang core curriculum sa kolehiyo?",o:["CMO No. 20, Series of 2013","CMO No. 59, Series of 1996","Executive Order No. 335","CMO No. 20, Series of 2014"],c:0,h:"Taong 2013 ito inilabas.",e:"Ang CHED Memorandum Order No. 20, Series of 2013 ang kontrobersyal na kautusang nag-alis sa Filipino bilang bahagi ng core curriculum sa kolehiyo."},
 {t:"Aralin 1",p:"Saang pamantasan naitatag ang Tanggol Wika noong Hunyo 21, 2014?",o:["Ateneo de Manila University","De La Salle University","Unibersidad ng Pilipinas Diliman","Politeknikong Universidad ng Pilipinas"],c:1,e:"Naitatag ang Tanggol Wika, alyansa ng mga tagapagtanggol ng wikang Filipino, sa De La Salle University upang labanan ang CMO No. 20."},
 {t:"Aralin 1",p:"Anong institusyon ang nanindigang ang Filipino ay \u201Csusi ng kaalamang bayan\u201D?",o:["PUP","ADMU","UP Diliman","DLSU"],c:2,e:"Ang UP Diliman ang nagsabing ang Filipino ay susi ng kaalamang bayan at mahalaga sa paghubog ng bayan."},
 {t:"Aralin 1",p:"Alin ang nag-aatas sa Pamahalaan na itaguyod ang Filipino bilang midyum ng opisyal na komunikasyon at wika ng pagtuturo?",o:["Artikulo XIV, Seksiyon 6 ng Konstitusyon","Artikulo II, Seksiyon 6 ng Konstitusyon","Executive Order No. 335","CMO No. 20"],c:0,e:"Ang Artikulo XIV, Seksiyon 6 ng Konstitusyon ang legal na batayan sa pagtataguyod ng Filipino bilang midyum ng opisyal na komunikasyon at wika ng pagtuturo."},
 {t:"Aralin 1",p:"Sino ang naglabas ng Executive Order No. 335 na nag-aatas sa mga ahensya ng pamahalaan na gamitin ang Filipino sa opisyal na transaksiyon?",o:["Ferdinand Marcos","Manuel Quezon","Fidel Ramos","Corazon Aquino"],c:3,e:"Inilabas ni dating Pangulong Corazon Aquino ang EO No. 335."},
 {t:"Aralin 2",p:"Sino ang nagpakahulugan sa komunikasyon bilang \u201Cproseso ng pagpapasa at pag-unawa sa impormasyon mula sa isang tao patungo sa kanyang kapwa\u201D?",o:["Louis Allen (1958)","Keith Davis (1967)","Newman at Summer (1977)","Keyton (2011)"],c:1,e:"Si Keith Davis (1967) ang nagbigay ng kahulugang ito. Si Louis Allen naman ay nagbigay-diin sa kabuuang ginagawa ng tao upang lumikha ng unawaan sa isip ng iba."},
 {t:"Aralin 2",p:"Alin sa mga elemento ng komunikasyon ang tumutukoy sa pidbak ng tagatanggap batay sa kanyang pagpapakahulugan sa mensahe?",o:["Epekto","Daluyan","Tugon","Konteksto"],c:2,e:"Ang tugon ang pidbak ng tagatanggap. Ang epekto naman ay kung paano naaapektuhan ang tagatanggap sa emosyonal o sikolohikal na paraan."},
 {t:"Aralin 2",p:"Ang ingay sa paligid at init ng silid ay halimbawa ng anong uri ng sagabal?",o:["Pisikal","Pisyolohikal","Semantiko","Sikolohikal"],c:0,h:"Panlabas na salik ito.",e:"Ang pisikal na sagabal ay mga panlabas na salik tulad ng ingay at temperatura. Ang pisyolohikal ay may kaugnayan sa kondisyon ng pangangatawan ng indibidwal."},
 {t:"Aralin 2",p:"Ang biases at prejudices ay nabibilang sa anong uri ng sagabal sa komunikasyon?",o:["Kultural","Teknolohikal","Semantiko","Sikolohikal"],c:3,e:"Ang sikolohikal na sagabal ay nakaugat sa pag-iisip, tulad ng biases at prejudices."},
 {t:"Aralin 2",p:"Alin sa mga sumusunod na uri ng di-berbal na komunikasyon ang tumutukoy sa gamit ng espasyo o distansya?",o:["Kinesika","Proksemika","Haptics","Chronemics"],c:1,e:"Ang proksemika ay tungkol sa espasyo o distansya. Ang kinesika ay kilos, chronemics ay oras, vocalics ay tono ng boses, at haptics ay haplos."}
];
const LETTERS="ABCD";
const $=id=>document.getElementById(id);
let order, idx, score, answered, log;

function start(list){
  order = list; idx = 0; score = 0; answered = false; log = [];
  $("result").classList.add("hidden"); $("quiz").classList.remove("hidden");
  show();
}
function show(){
  const q = QUESTIONS[order[idx]];
  answered = false;
  $("count").textContent = "Tanong " + (idx+1) + " ng " + order.length;
  $("tally").textContent = "Tama: " + score;
  $("fill").style.width = (idx/order.length*100) + "%";
  $("topic").textContent = q.t;
  $("prompt").textContent = q.p;
  $("feedback").innerHTML = "";
  $("next").classList.add("hidden");
  $("next").textContent = idx === order.length-1 ? "Tingnan ang iskor" : "Susunod na tanong";
  const hint = $("hint"); hint.classList.add("hidden");
  const hb = $("hintBtn");
  if(q.h){ hb.classList.remove("hidden"); hint.textContent = q.h; } else { hb.classList.add("hidden"); }
  const ul = $("opts"); ul.innerHTML = "";
  q.o.forEach((text,i)=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.type = "button"; b.className = "opt";
    b.innerHTML = '<span class="key">'+LETTERS[i]+'</span><span></span>';
    b.lastChild.textContent = text;
    b.addEventListener("click",()=>choose(i));
    li.appendChild(b); ul.appendChild(li);
  });
}
function choose(i){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[order[idx]];
  const right = i === q.c;
  if(right) score++;
  log.push({n:order[idx], pick:i, right});
  [...$("opts").querySelectorAll(".opt")].forEach((b,j)=>{
    b.disabled = true;
    if(j === q.c) b.classList.add("ok");
    else if(j === i) b.classList.add("bad");
    else b.classList.add("dim");
  });
  $("tally").textContent = "Tama: " + score;
  $("hintBtn").classList.add("hidden"); $("hint").classList.add("hidden");
  $("feedback").innerHTML = '<div class="feedback '+(right?"ok":"bad")+'"><strong>'+(right?"Tama!":"Hindi pa tama.")+'</strong><span></span></div>';
  $("feedback").querySelector("span").textContent = q.e;
  $("fill").style.width = ((idx+1)/order.length*100) + "%";
  $("next").classList.remove("hidden");
  $("next").focus();
}
function finish(){
  $("quiz").classList.add("hidden"); $("result").classList.remove("hidden");
  const total = order.length;
  $("final").textContent = score;
  document.querySelector(".score small").textContent = " / " + total;
  const pct = score/total;
  $("verdict").textContent = pct === 1 ? "Perpekto! Handa ka na." : pct >= .8 ? "Magaling! Konting rebyu na lang." : pct >= .5 ? "Maayos ang simula. Balikan ang mga mali sa ibaba." : "Balikan ang rebyuwer at subukan ulit.";
  const missed = log.filter(x=>!x.right);
  $("retryMissed").classList.toggle("hidden", missed.length === 0);
  const ul = $("review"); ul.innerHTML = "";
  missed.forEach(x=>{
    const q = QUESTIONS[x.n];
    const li = document.createElement("li");
    li.innerHTML = "<b></b><br><span class='u'></span><br><span class='a'></span>";
    li.querySelector("b").textContent = q.p;
    li.querySelector(".u").textContent = "Sagot mo: " + q.o[x.pick];
    li.querySelector(".a").textContent = "Tamang sagot: " + q.o[q.c];
    ul.appendChild(li);
  });
  window.scrollTo({top:0});
}
$("next").addEventListener("click",()=>{ idx++; idx < order.length ? show() : finish(); });
$("hintBtn").addEventListener("click",()=>{ $("hint").classList.remove("hidden"); $("hintBtn").classList.add("hidden"); });
$("retry").addEventListener("click",()=>start(QUESTIONS.map((_,i)=>i)));
$("retryMissed").addEventListener("click",()=>start(log.filter(x=>!x.right).map(x=>x.n)));
document.addEventListener("keydown",e=>{
  if($("quiz").classList.contains("hidden")) return;
  const k = "1234".indexOf(e.key);
  if(k > -1 && !answered) choose(k);
  else if(e.key === "Enter" && answered && document.activeElement !== $("next")) $("next").click();
});
start(QUESTIONS.map((_,i)=>i));
</script>
</body>
</html>
